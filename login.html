<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Copado Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <div class="login-brand">
        <span class="login-logo" aria-hidden="true">C</span>
        <div>
          <span class="login-brand-name">copado</span>
          <span class="login-brand-sub">Support Team</span>
        </div>
      </div>
      <h1 class="login-title">Sign in to your account</h1>
      <p class="login-subtitle">Use social login or the Admin account below</p>

      <div class="oauth-buttons" id="oauth-buttons"></div>
      <p class="login-hint" id="oauth-hint" hidden></p>

      <div class="login-divider" id="oauth-divider" hidden><span>or</span></div>

      <p class="login-section-label">Admin account</p>
      <form id="login-form" class="login-form" autocomplete="on">
        <label class="login-label" for="username">Username</label>
        <input class="login-input" id="username" name="username" type="text" required autocomplete="username" />

        <label class="login-label" for="password">Password</label>
        <input class="login-input" id="password" name="password" type="password" required autocomplete="current-password" />

        <p class="login-error" id="login-error" hidden></p>

        <button type="submit" class="btn-primary login-submit">Sign in</button>
      </form>
    </div>

    <script>
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("login-error");
      const oauthButtons = document.getElementById("oauth-buttons");
      const oauthDivider = document.getElementById("oauth-divider");
      const oauthHint = document.getElementById("oauth-hint");

      fetch("/api/me", { credentials: "same-origin" })
        .then((r) => {
          if (r.ok) location.href = "/";
        })
        .catch(() => {});

      fetch("/auth/providers")
        .then((r) => r.json())
        .then((data) => {
          const showGithub = data.github?.configured && data.github?.enabled;
          const showGoogle = data.google?.configured && data.google?.enabled;
          if (showGithub) {
            oauthButtons.insertAdjacentHTML(
              "beforeend",
              `<a class="google-btn" href="/auth/github">
                <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
                  <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                Continue with GitHub
              </a>`
            );
          }
          if (showGoogle) {
            oauthButtons.insertAdjacentHTML(
              "beforeend",
              `<a class="google-btn" href="/auth/google">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                  <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/>
                  <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                  <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.5 16.1 44 24 44z"/>
                  <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l.1.1 6.2 5.2C39.2 37.3 44 32 44 24c0-1.3-.1-2.5-.4-3.5z"/>
                </svg>
                Continue with Google
              </a>`
            );
          }
          oauthDivider.hidden = !(showGithub || showGoogle);
          if (!showGithub && !showGoogle) {
            oauthHint.hidden = false;
            oauthHint.textContent = "Social login is off or not configured. Use the Admin account below.";
          }
        })
        .catch(() => {});

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.hidden = true;
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        try {
          const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ username, password }),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || "Login failed");
          }
          location.href = "/";
        } catch (err) {
          errorEl.textContent = err.message || "Login failed";
          errorEl.hidden = false;
        }
      });
    </script>
  </body>
</html>
